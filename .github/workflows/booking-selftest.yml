name: booking-selftest

# Временная проверка приёма броней: пингует веб-приложение Google Таблицы
# и (по запросу) отправляет тестовую заявку через тот же путь, что и сайт.
on:
  workflow_dispatch:
    inputs:
      test_booking:
        description: 'Отправить тестовую заявку в таблицу и Telegram'
        type: boolean
        default: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        run: |
          URL="https://script.google.com/macros/s/AKfycbwFY3liVkjJOY9_XHkQ4O8JvX0wkjctoQIzOglTRkmt6UuUafvpfGpIyEh82eyt-nUzzQ/exec"
          echo "GET action=ping"
          curl -sS -m 30 "$URL?action=ping"; echo
          echo "GET action=status"
          curl -sS -m 30 "$URL?action=status"; echo
      - name: test booking (POST как из браузера)
        if: ${{ inputs.test_booking }}
        run: |
          URL="https://script.google.com/macros/s/AKfycbwFY3liVkjJOY9_XHkQ4O8JvX0wkjctoQIzOglTRkmt6UuUafvpfGpIyEh82eyt-nUzzQ/exec"
          REF="p-ci-$(date +%s)"
          echo "POST action=book ref=$REF"
          curl -sS -m 40 -X POST "$URL" \
            -F "action=book" -F "name=Проверка сайта (тест)" -F "phone=+7 918 116-45-54" \
            -F "dateFrom=2026-11-01" -F "dateTo=2026-11-03" -F "nights=2" -F "guests=2" \
            -F "room=single-1" -F "roomLabel=Номер 1" -F "price=2500" -F "total=5000" \
            -F "comment=Тестовая заявка из GitHub Actions, можно удалить" \
            -F "ref=$REF" -F "page=/selftest"; echo
          echo "GET action=verify"
          curl -sS -m 30 "$URL?action=verify&ref=$REF"; echo
